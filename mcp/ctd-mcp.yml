generated: '2026-07-18'
method: searched
source: https://ctd.ai/integrations-mcp + https://app.ctd.ai/.well-known/oauth-protected-resource
status: available
name: Connect The Dots
description: >-
  Official hosted/remote MCP server for Connect The Dots. Lets any MCP-compatible
  AI client (Claude, Cursor) query your relationship graph — find warm paths to a
  person or company, identify decision-makers, and track job changes — with no code
  and no API keys.
server_url: https://app.ctd.ai/mcp
hosting: remote
transport: http
auth:
  type: oauth2
  flow: authorization_code
  pkce: S256
  dynamic_client_registration: true
  authorization_server: https://app.ctd.ai/users-api
  authorization_endpoint: https://app.ctd.ai/oauth/authorize
  token_endpoint: https://app.ctd.ai/users-api/v2/oauth/token
  scopes:
  - read
  - write
capabilities:
# Documented usage examples from the MCP page (not verbatim tool names —
# CTD does not publish an explicit tool manifest).
- Find contacts at a specific company with warm relationship paths
- Identify decision-makers by role and location
- Track job changes among your network contacts
- Map relationship chains to a target person or company
install:
  clients:
  - Claude
  - Cursor
  - Other MCP-compatible clients
  claude_connector_url: https://claude.ai/customize/connectors?modal=add-custom-connector&connectorName=Connect+The+Dots&connectorUrl=https%3A%2F%2Fapp.ctd.ai%2Fmcp%2F
  notes: >-
    An org admin first enables the connector in organization settings, then each
    user connects it from Claude Customize > Connectors and approves the OAuth
    authorization. No manual API keys.
access: Unlimited MCP access on paid plans (Professional basic; Team/Business full).
docs: https://ctd.ai/integrations-mcp
