aid: ctd
name: Connect The Dots
description: >-
  Connect The Dots (CTD) is a relationship intelligence platform that scores every
  relationship across a team's network — from real two-way email and LinkedIn activity —
  to surface the warmest introduction path to any person or company. It merges everyone's
  contacts into one deduplicated "Supergraph," routes intros through the best-connected
  colleague (including "ghost emails" sent on their behalf), tracks job changes, and
  activates the network for sales, recruiting, and VC/PE deal sourcing. Everything in the
  app is exposed through a simple two-header REST API and a hosted MCP server for AI clients
  like Claude and Cursor. Backed by Norwest Venture Partners.
